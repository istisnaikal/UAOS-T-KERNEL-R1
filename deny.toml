# SPDX-License-Identifier: Apache-2.0
#
# Supply-chain policy. Anything not allowed here fails the merge.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Each exception names its advisory, why it cannot be fixed now, and when it ends.
ignore = [
  # zbus 6.0.0 absorbed zvariant, zbus_names and zvariant_derive. They reach us only through the
  # Linux keyring store: zbus-secret-service-keyring-store 1.0.1 -> secret-service 5.2.0 -> zbus 5,
  # and neither has a release on zbus 6 as of 2026-10-18. Unmaintained, not a vulnerability. Remove
  # these when the keyring store moves to zbus 6.
  { id = "RUSTSEC-2026-0370", reason = "zvariant: merged into zbus 6; the keyring store is still on zbus 5" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names: merged into zbus 6; the keyring store is still on zbus 5" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: merged into zbus 6; the keyring store is still on zbus 5" },
]

[licenses]
version = 2
confidence-threshold = 0.93
# Every entry must be compatible with distributing an Apache-2.0 binary. Notices are aggregated in
# NOTICE at release time. Only licenses the dependency graph uses are listed: one returns, reviewed,
# with the dependency that needs it (`cargo deny` warns of an allowance nothing uses). Should
# MPL-2.0 return, it is file-level copyleft and allowed only for unmodified upstream use.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
]
# NCSA (University of Illinois/NCSA, a permissive BSD-style license) for libfuzzer-sys alone: it
# vendors LLVM's libFuzzer and is a dependency of the fuzz workspace only (fuzz/), never of a
# shipped crate, and runs only in the nightly lane. The nightly job checks that workspace against
# this file (`cargo deny --manifest-path fuzz/Cargo.toml --config deny.toml check`).
exceptions = [
  { crate = "libfuzzer-sys", allow = ["NCSA"] },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between private (publish = false) workspace crates carry no version by design.
allow-wildcard-paths = true
deny = [
  { crate = "openssl", reason = "TLS and crypto are aws-lc-rs only" },
  { crate = "openssl-sys", reason = "TLS and crypto are aws-lc-rs only" },
  { crate = "ring", reason = "TLS and crypto are aws-lc-rs only" },
  { crate = "serde_yaml", reason = "unmaintained; YAML is not a config format here" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
