# SPDX-License-Identifier: Apache-2.0
[package]
name = "uaos-redact-scan"
description = "UAOS final scan: the last fail-closed check of outbound bytes, and the detectors it shares with redaction. It has no edge to the shared JSON tokenizer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

# No doctests: rustdoc builds them with the dev-dependencies, outside the checks that hold this
# crate's `dev_ban`. arch-check requires it.
[lib]
doctest = false

# No `uaos-json` here, ever: arch.toml bans it from this crate's closure.
[dependencies]
aho-corasick.workspace = true
memchr.workspace = true
thiserror.workspace = true
uaos-contracts.workspace = true

[lints]
workspace = true
