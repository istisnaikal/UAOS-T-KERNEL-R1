# SPDX-License-Identifier: Apache-2.0
#
# Gate registry. Validated by `cargo xtask gates` on every merge.
#
#   active - runs in CI (`job`) and is proven to bite by a seeded violation (`negative`).
#
# The required set is hard-coded in xtask/src/gates.rs; removing an entry needs an RFC. The README
# status heading must name [project] phase; `cargo xtask gates` fails the merge when they drift.

[project]
phase = "P3"

[[gate]]
id = "fmt"
source = "fmt/clippy/test"
lane = "merge"
status = "active"
job = "fmt"
negative = ["fmt-unformatted"]

[[gate]]
id = "clippy"
source = "Fmt/clippy/test; code standard."
lane = "merge"
status = "active"
job = "clippy"
negative = ["clippy-unwrap", "clippy-unsafe", "clippy-ambient-clock", "clippy-nondeterministic-map", "egress-ctor-outside-root", "net-dns-outside-egress", "net-connect-outside-egress", "net-udp-outside-egress", "spawn-outside-supervisor", "net-listen-outside-api", "net-resolver-outside-egress", "net-socket-listen-outside-api", "net-unix-connect-outside-egress", "net-unix-connect-addr-outside-egress", "net-tokio-unix-connect-outside-egress", "net-unix-socket-connect-outside-egress", "net-named-pipe-outside-egress", "spawn-through-tokio-executor", "clippy-ban-path-unresolved", "clippy-ban-silenced", "unbounded-channel", "foreign-source-clippy-only"]

[[gate]]
id = "sources"
source = "(the final scan's independence)."
lane = "merge"
status = "active"
job = "clippy"
negative = ["foreign-source-built-path", "foreign-source-cfg-attr-raw", "foreign-source-symlink", "foreign-source-outside-clippy", "foreign-source-release-only", "foreign-source-default-features-only", "foreign-source-release-all-features-only", "foreign-source-build-script", "foreign-source-local-package", "final-scan-pin-shadowed-in-release"]

