-surfaced", "coordinator-flushes-per-append", "state-queue-drops-on-full", "state-actor-timer-dropped-on-caller", "state-final-flush-unreported", "state-queue-reorders-waiting-callers", "state-flush-delay-unmeasured", "supervisor-os-refusal-uncounted", "state-queue-depth-unreported", "state-retry-delay-from-deadline", "journal-failure-keeps-admitting", "actor-end-leaves-kernel-running", "shutdown-persists-as-stopped", "shutdown-record-before-drain", "missing-shutdown-trusted-on-old-journal", "shutdown-clean-despite-later-records", "open-work-at-shutdown-read-as-clean", "boot-reads-journal-twice", "stop-retry-ignores-pause", "stop-backoff-never-doubles", "stop-backoff-uncapped", "stop-failure-skips-earlier-flush", "stop-record-appended-twice", "stop-ignores-platform-failure", "sync-failure-keeps-admitting", "state-flush-age-misses-stop-flush", "stop-generation-ignored", "stop-record-drops-generation", "stop-record-drops-engager", "relay-engages-as-someone-else", "shutdown-unflushed-read-as-clean", "shutdown-not-sealed", "open-writes-the-seal", "seal-kept-after-boot", "seal-failure-left-behind", "seal-hash-unchecked", "start-cut-keeps-the-seal", "seal-waits-for-the-marker", "opens-own-records-decide-the-end", "drain-race-admits-past-the-count", "stop-inline-flush-failure-forgotten", "redact-tape-differential-disagrees", "key-read-from-terminal", "key-echoed-in-output", "key-account-outside-installation", "key-index-failure-keeps-new-key", "doctor-misses-missing-key", "init-reopens-journal", "lib-needs-dev-feature"]

[[gate]]
id = "secret-scan"
source = "secret scan"
lane = "merge"
status = "active"
job = "secrets"
negative = ["secret-committed"]

[[gate]]
id = "cargo-deny"
source = "cargo deny"
lane = "merge"
status = "active"
job = "deny"
negative = ["license-not-allowed"]

[[gate]]
id = "cargo-vet"
source = "Supply chain."
lane = "merge"
status = "active"
job = "vet"
negative = ["unaudited-dependency"]

[[gate]]
id = "spdx-headers"
source = "License hygiene."
lane = "merge"
status = "active"
job = "headers"
negative = ["spdx-header-missing"]

[[gate]]
id = "dco"
source = "Contributions (DCO, no CLA)."
lane = "merge"
status = "active"
job = "dco"
negative = ["dco-missing-signoff", "dco-unsigned-content-merge"]

[[gate]]
id = "codeql"
source = "Static analysis."
lane = "merge"
status = "active"
job = "codeql"
negative_exempt = "Third-party analyzer; seeding a real vulnerability to prove detection is out of scope. Findings block via code scanning alerts."

[[gate]]
id = "arch-check"
source = "One mechanism per concern."
lane = "merge"
status = "active"
job = "arch"
negative = ["arch-forbidden-edge", "final-scan-crate-reaches-tape", "final-scan-ban-dropped", "arch-optional-edge-unseen", "arch-dev-dependency-reaches-tape", "arch-source-from-another-crate", "arch-local-package-outside-workspace", "arch-bin-depends-on-egress", "arch-renamed-dependency", "arch-extern-crate-at-root", "arch-dev-ban-doctests-on", "arch-extern-crate-behind-c-string", "arch-required-edge-dropped", "arch-library-renamed", "arch-pinned-build-dependency", "arch-pinned-build-script", "arch-pinned-features", "arch-pinned-closure-unpinned", "arch-pinned-closure-build-script", "arch-old-edition", "arch-required-edge-optional", "arch-required-edge-conditional", "arch-ring1-reaches-kernel", "arch-ring1-depends-on-hyper", "arch-json-io-dependency"]

[[gate]]
id = "schema-compat"
source = "Contract versioning."
lane = "merge"
status = "active"
job = "schemas"
negative = ["schema-breaking-change", "schema-drift"]

[[gate]]
id = "docs-contract-sync"
source = "docs-changed-with-contract"
lane = "merge"
status = "active"
job = "docs-sync"
negative = ["contract-without-changelog"]

[[gate]]
id = "language-neutrality"
source = "Language neutrality (7-locale corpus)."
lane = "merge"
status = "active"
job = "test"
negative = ["selector-folds-case", "module-text-accepts-bidi-override", "module-text-accepts-tag", "module-text-accepts-variation-run", "module-text-invisible-base", "module-text-ideographic-any-base"]

[[gate]]
id = "gate-registry"
source = "Gate registry."
lane = "merge"
status = "active"
job = "gates"
negative = ["gate-registry-incomplete", "docs-phase-line-stale", "merge-gate-missing-job", "promise-overdue", "promise-met-by-unlisted-negative"]

[[gate]]
id = "status-truth"
source = "The built and not-built lists in README.md must match the workspace and arch.toml, and the README must announce every product crate"
lane = "merge"
status = "active"
job = "gates"
negative = ["status-built-crate-unlisted", "status-module-unlisted"]

[[gate]]
id = "gate-selftest"
source = "plan P0 acceptance: every gate shown to fail on a seeded violation"
lane = "merge"
status = "active"
job = "negative"
negative_exempt = "This gate is the harness that proves the others; its own bite is the BROKEN result it reports."

[[gate]]
id = "path-spaces-unicode"
source = "plan P0: build from a path with spaces and ü/ş/ı"
lane = "merge"
status = "active"
job = "paths"
negative_exempt = "Environmental: the job itself is the positive proof on Windows; a seeded failure would require breaking path handling on purpose."

[[gate]]
id = "allow-audit"
source = "Guarded lints (unsafe_code, disallowed methods/types) may be allowed only under owner paths in arch.toml"
lane = "merge"
status = "active"
job = "arch"
negative = ["allow-audit-guarded-lint-outside-owner", "allow-audit-hidden-behind-c-string", "allow-audit-include-renamed", "allow-audit-unsafe-outside-owner", "clippy-config-nested", "lints-not-inherited", "cargo-config-clippy-override", "clippy-ban-without-canary", "allow-audit-lint-group", "allow-audit-macro-attribute", "allow-audit-path-module", "allow-audit-nested-target", "workspace-lints-group-allowed", "clippy-config-case", "cargo-config-not-alias", "build-script-clippy-env", "canary-malformed", "canary-calls-another-item", "build-script-declared-path", "canary-copied-from-sibling", "canary-setup-calls-another-ban", "build-script-module", "build-dependency-path", "build-script-include-in-owner", "allow-audit-hidden-by-cache-tag"]

[[gate]]
id = "vet-ratchet"
source = "Cargo-vet exemptions without a notes reason may not grow, and progress must be recorded"
lane = "merge"
status = "active"
job = "vet"
negative = ["vet-ratchet-unnoted-exemption"]

[[gate]]
id = "claims-lint"
source = "Forbidden claim words in every text file of the repository"
lane = "merge"
status = "active"
job = "headers"
negative = ["claims-forbidden-word", "claims-forbidden-word-txt", "claims-forbidden-word-code-comment", "claims-forbidden-word-string-literal", "claims-nul-undeclared", "claims-declared-binary-text", "claims-unreadable-text"]

[[gate]]
id = "journal-durability"
source = "journal durability (40 real kills per OS per merge; 10,000 per OS nightly), payloads included (chunks flushed before the records that reference them, payload before record, one writer per chunk)"
lane = "merge"
status = "active"
job = "test"
negative = ["journal-ack-without-write", "chunk-flushed-before-sync", "intent-before-chunk-write", "chunk-put-pair-race", "chunk-put-shared-temp", "marker-before-loss-report", "store-flush-failure-forgotten", "recovery-reflushes-same-file", "chunk-rewrite-unflushed", "chunk-rewrite-new-data-key", "loss-flushed-before-report", "open-trusts-previous-segment", "open-stores-manifest-before-flush", "is-stored-trusts-earlier-pair", "flush-skips-missing-pending-file", "loss-set-aside-after-quarantine", "shred-not-completed-at-open", "shred-bypasses-journal", "shreds-before-manifest-at-open", "shred-incomplete-key-only", "plain-marker-trusted", "put-overlapping-failed-flush", "failed-shred-vouched", "flush-acked-across-poisoning", "shred-marked-after-record", "failed-put-lifts-shred-mark", "rotation-skips-current-key", "store-flush-poisons-outside-window", "shred-mark-not-restored", "shred-unmarked-after-written-record", "kernel-record-appended-directly", "store-losses-taken-by-caller", "recovery-leaves-store-poisoned", "payload-failure-hides-torn-segment", "lost-content-reads-as-unavailable", "unauthentic-loss-skipped-at-open", "unauthentic-loss-skipped-in-recovery", "missing-loss-reads-as-unavailable", "shredded-content-reads-as-lost", "shred-of-quarantined-payload-skipped", "loss-cause-overwritten", "recovery-drops-old-payload", "journal-first-open-bricks", "journal-new-history-over-records", "journal-new-history-checks-first-segment-only", "journal-new-history-over-a-marker", "coordinator-waits-for-next-append", "journal-deadline-follows-newest", "coordinator-ignores-its-timer", "state-drain-skips-schedule", "state-flush-age-misses-inline-flush", "coordinator-flushes-late-under-power-loss", "stop-record-queued-behind-others", "tick-skips-stop-retry", "kill-writer-exit-unseen", "stop-record-dropped-on-failure", "stop-marked-recorded-before-append", "state-actor-ignores-stop"]

[[gate]]
id = "budget-concurrency"
source = "budget concurrency (ledger simulation: 256 schedules per merge, 100,000 nightly; contended threads)"
lane = "merge"
status = "active"
job = "test"
negative = ["ledger-reserve-beyond-available"]

[[gate]]
id = "redaction-corpus"
source = "redaction corpus (detector set v1 vs synthetic corpus v2: 3,000 positives per class in six evasion forms, 100,000 negatives in 41 named families; recall >= 99.9% per class, FP <= 0.5% per class and per family)"
lane = "merge"
status = "active"
job = "test"
negative = ["redact-detector-drops-a-format", "redact-url-password-stops-at-slash", "redact-generator-draws-slash-password", "redact-tape-refusal-passes", "redact-skips-reparse-after-key-edit", "redact-output-outgrows-limits", "redact-reparse-limit-called-malformed", "redact-reparse-ignores-tape-limits", "redact-structural-refusal-retryable", "redact-output-tail-unchecked", "redact-shrinking-output-refused", "redact-key-edit-forgotten", "redact-size-check-off-by-one", "redact-edited-nodes-dropped"]

[[gate]]
id = "policy-semantics"
source = "Property-based: policy. Default deny, fail closed on evaluation errors, Deny > Ask > Allow, grants as approvals that never beat a forbid, slicing checked against the complete set, bounded policy text"
lane = "merge"
status = "active"
job = "test"
negative = ["policy-slicing-drops-unconstrained", "policy-error-fails-open", "policy-grant-overrides-forbid"]

[[gate]]
id = "cli-contract"
source = "Snapshots of the help text, exit codes and --json output"
lane = "merge"
status = "active"
job = "test"
negative = ["cli-help-changed", "cli-exit-code-changed", "cli-doctor-exits-zero-on-failure", "cli-keychain-missing-exits-internal", "cli-init-keychain-failure-unclassified"]

[[gate]]
id = "kernel-tokens"
source = "Secure path is the only one that compiles. Proven by rustdoc compile-fail doctests in uaos-runtime::pipeline, each with a seed that removes its guard; from S2, the call site: the door gets exactly the bytes the final scan read, and no client credential leaves; from S3, every edit is checked against the roles, its anchor and the mask before any byte changes."
lane = "merge"
status = "active"
job = "test"
negative = ["stage-skipped", "ready-outside-pipeline", "runtime-requires-module", "pipeline-ready-gets-the-original", "pipeline-forwards-client-credentials", "pipeline-headers-unscanned", "pipeline-limit-read-as-text", "pipeline-mask-misses-keys", "pipeline-unredacted-body-unscanned", "splice-ignores-forbidden-roles", "splice-checks-ancestors-only", "splice-live-edit-anywhere", "splice-ignores-mask", "splice-overlap-unchecked", "splice-strip-keeps-comma", "splice-output-unchecked", "pipeline-plan-on-text-applied"]

[[behavior]]
id = "disk-full"
source = "disk full (journal fails closed and recovers; uaos-state tests)"
status = "active"
phase = "P1"
gate = "journal-durability"

[[behavior]]
id = "budget-double-spend"
source = "budget double-spend (single-use reservation ids, one closing entry; uaos-ledger tests)"
status = "active"
phase = "P2"
gate = "budget-concurrency"
