source = "fmt/clippy/test"
lane = "merge"
status = "active"
job = "test"
negative = ["config-holds-secret", "final-scan-reexport-replaced", "final-scan-pin-shadowed-by-module", "test-failure", "identity-epoch-check-skipped", "egress-dials-private-range", "egress-numeric-host", "egress-private-reaches-link-local", "egress-plaintext-resolved", "egress-breaker-admits-after-cooldown", "egress-probe-stuck-on-cancel", "egress-embedded-local", "egress-sends-trace", "egress-forwards-switching-protocols", "egress-forwards-contradicting-length", "osfs-doubled-separator-unc", "egress-forwards-unknown-transfer-coding", "egress-forwards-repeated-length", "osfs-bare-volume", "egress-forwards-bodiless-length", "egress-delivered-reported-unsent", "egress-timeout-reported-unsent", "egress-unsent-reported-delivered", "egress-unassigned-timeout-reported-delivered", "egress-canceled-reported-delivered", "json-duplicate-key-unchecked", "json-escaped-duplicate-compared-raw", "json-fingerprint-raw-bytes", "json-fingerprint-collision-accepts", "json-fingerprint-collision-rejects", "json-fingerprint-word-order", "json-run-scratch-doubles", "json-pairwise-skips-shared-fingerprint", "json-depth-off-by-one", "json-lone-surrogate-accepted", "json-trailing-data-accepted", "json-bom-stripped", "json-leading-zero-accepted", "json-decode-escape-wrong", "module-unknown-feature-loaded", "module-act-at-observe-point", "module-state-unbounded", "module-state-call-kept", "module-decls-at-unhooked-point", "module-event-value-undeclared", "view-masked-key-readable", "view-masked-key-found-by-name", "selector-predicate-unbounded", "path-pattern-crosses-segment", "path-not-canonical", "agent-id-serialized-when-absent", "endpoint-unmatched-not-denied", "module-rank-empty-accepted", "view-masked-container-leaks", "role-check-ancestors-only", "replay-declares-again", "path-parameter-canonical", "module-cancel-without-feature", "module-manifest-reread", "view-sealed-mask-drifts", "strip-removes-anchor", "strip-touches-masked", "selector-unbudgeted", "usage-undeclared-dimension", "fa